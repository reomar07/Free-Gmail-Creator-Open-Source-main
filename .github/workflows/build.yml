name: Build Project

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: GmailCreator.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: AnyCPU

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1
      with:
        msbuild-version: latest
    
    - name: Setup NuGet
      uses: nuget/setup-nuget@v1
      with:
        nuget-version: latest
    
    - name: Restore NuGet packages
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}
    
    - name: Build solution
      run: msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Configuration=${{ env.BUILD_CONFIGURATION }}
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GmailCreator-${{ env.BUILD_CONFIGURATION }}
        path: bin/${{ env.BUILD_CONFIGURATION }}/
        retention-days: 30
    
    - name: Upload logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          *.log
          **/*.log
